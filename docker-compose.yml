version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: DockerFile
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001